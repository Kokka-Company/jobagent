[project]
name = "jobagent"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
description = "Tailor a master LaTeX resume to a job posting and (semi-)automate applications."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "playwright>=1.47",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobagent = "jobagent.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobagent*"]
